version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lead_tracker
    ports:
      - "5432:5432"
    volumes:
      - lead_tracker_data:/var/lib/postgresql/data

volumes:
  lead_tracker_data:
